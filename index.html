<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Holonote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#02080f;--c:#5fd8ff;--c2:#2a8fd0;--dim:#1b4d6e;--glow:rgba(95,216,255,.35);--warn:#ffb347;--red:#ff5a6a;--ok:#6dffb0;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#0a2a44 0%,var(--bg) 60%) fixed;color:var(--c);font-family:'Share Tech Mono',ui-monospace,Menlo,monospace;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(95,216,255,.05) 0 1px,transparent 1px 3px);animation:scan 8s linear infinite}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
@keyframes scan{to{background-position:0 60px}}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.82}94%{opacity:1}97%{opacity:.9}}
@keyframes rise{from{opacity:0;transform:translateY(8px) scaleY(.96);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 80px;animation:flick 6s infinite}
header{text-align:center;padding:10px 0 18px;position:relative}
.ring{width:64px;height:64px;margin:0 auto 10px;border:2px solid var(--c);border-radius:50%;box-shadow:0 0 18px var(--glow),inset 0 0 14px var(--glow);position:relative;animation:spin 14s linear infinite}
.ring::before,.ring::after{content:"";position:absolute;inset:8px;border:1px dashed var(--c2);border-radius:50%}
.ring::after{inset:20px;border-style:solid;opacity:.6}
h1{font-family:Orbitron,Arial,sans-serif;font-weight:800;letter-spacing:.35em;font-size:clamp(18px,5vw,30px);margin:0;text-shadow:0 0 12px var(--c),0 0 30px var(--glow)}
.sub{font-size:12px;letter-spacing:.3em;color:var(--c2);margin-top:6px;text-transform:uppercase}
.who{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:14px;font-size:13px}
.panel{border:1px solid var(--dim);background:linear-gradient(180deg,rgba(95,216,255,.09),rgba(95,216,255,.02));box-shadow:0 0 22px rgba(95,216,255,.12),inset 0 0 24px rgba(95,216,255,.05);padding:16px;margin:14px 0;position:relative;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.panel::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.badge{display:inline-block;padding:2px 9px;border:1px solid currentColor;font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;border-radius:2px}

nav{display:flex;gap:8px;justify-content:center;margin:6px 0}
button,select,input,textarea{font:inherit;color:var(--c);background:rgba(2,16,28,.7);border:1px solid var(--c2);padding:9px 12px;border-radius:2px;outline:none}
button{cursor:pointer;font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;transition:.2s}
button:hover:not(:disabled){background:rgba(95,216,255,.2);box-shadow:0 0 14px var(--glow)}
button:disabled{opacity:.4;cursor:default}
button.on{background:rgba(95,216,255,.22);box-shadow:0 0 14px var(--glow)}
button.danger{border-color:var(--red);color:var(--red)}
button.sign{border-color:var(--ok);color:var(--ok)}
textarea{width:100%;min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{box-shadow:0 0 12px var(--glow);border-color:var(--c)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:180px}
.mot{animation:rise .5s both}
.mot .txt{font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:8px 0 12px;color:#d6f4ff}
.meta{font-size:12px;color:var(--c2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sigs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;align-items:center}
.sg{font-size:11px;padding:3px 8px;border:1px solid var(--dim);background:rgba(109,255,176,.07)}
.sg b{font-weight:400;color:var(--ok)}
.empty,.note{color:var(--c2);text-align:center;padding:20px;font-size:13px}
.note{font-size:12px;padding:8px;opacity:.8}
.deny{text-align:center;padding:30px 10px}
.deny h2{font-family:Orbitron,sans-serif;color:var(--red);letter-spacing:.25em;text-shadow:0 0 14px rgba(255,90,106,.6);margin:0 0 10px}
.base{height:6px;margin:30px auto 0;width:60%;background:radial-gradient(ellipse,var(--c),transparent 70%);filter:blur(2px);opacity:.7}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:8px 4px;border-bottom:1px solid rgba(27,77,110,.6);vertical-align:middle}
.tbl td:last-child{text-align:right;white-space:nowrap}
.hide{display:none}
.g0{color:#ffd84d;text-shadow:0 0 8px rgba(255,216,77,.6)}.g1{color:#ff9d5f}.g2{color:#ff8fd8}.g3{color:var(--ok)}.g4{color:var(--c)}
.tbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tbar>input,.tbar>select{flex:1;min-width:140px}
.arrow{color:var(--c2)}
.grid{display:grid;grid-template-columns:1.2fr 1fr 1.4fr auto;gap:8px;align-items:center;margin:6px 0}
@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}}
.tag{font-size:12px;color:var(--c2)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--dim);cursor:pointer;font-size:13px;user-select:none;transition:.15s}.chip:hover{border-color:var(--c2)}.chip.on{border-color:var(--c);background:rgba(95,216,255,.2);box-shadow:0 0 10px var(--glow)}
.me{border-color:var(--c)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== CONFIG FIREBASE : colle ici les valeurs de ton projet ====== */
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyAAvvUm4E-i64jiaCWNiOBFR8ZGMdADaTY",
  authDomain: "holocarnet.firebaseapp.com",
  projectId: "holocarnet",
  storageBucket: "holocarnet.firebasestorage.app",
  messagingSenderId: "969570757326",
  appId: "1:969570757326:web:fddc09ea8bb798ae72be9f"
};
window.OWNER_EMAIL = "maxximel04@gmail.com"; /* = CMD Deviss */
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ring"></div>
    <h1>HOLONOTE</h1>
    <div class="sub">Carnet de liaison holographique</div>
    <div class="who" id="who"></div>
  </header>
  <nav id="nav" class="tbar hide" style="justify-content:center"></nav>
  <main id="main"><div class="empty">Initialisation du projecteur holographique…</div></main>
  <div class="base"></div>
</div>
<script>
(function(){
var OWNER='Deviss';
var GRADES=["CMD Deviss","CMD A'den","Gérant signature","Officier"];
var SIGN_OK=[0,1,2],EDIT_OK=[0,1];
var FB=false,needLogin=false,EMAIL=null,linked=false,db=null,myId=null,isOwner=false,me=null,tab='C',errMsg='',dbOk=true;
var cmds=[],membres=[],mots=[],sigs=[],liens=[],ready={c:false,m:false,t:false,s:false,l:false};
var TARGETS=[''],DRAFT='',F={t:'',a:'',q:''},SF='todo';
var $=function(i){return document.getElementById(i)};
function key(e){return String(e||'').trim().toLowerCase()}
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function badge(g){return g>=0?el('span','badge g'+g,GRADES[g]):el('span')}
function fmt(t){try{return new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
var CONF=null,CT=null;
function safeErr(e){errMsg=((e&&e.code)?e.code+' : ':'')+((e&&e.message)||'Erreur de transmission');render();try{window.scrollTo(0,0)}catch(x){}}
function rid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ask(btn,fn){var t=btn.textContent,w=false;btn.onclick=function(){if(!w){w=true;btn.textContent='Confirmer ?';setTimeout(function(){w=false;btn.textContent=t},4000);return}w=false;btn.textContent=t;fn()}}
function find(id){return cmds.concat(membres).filter(function(m){return m._id===id})[0]}
function nameOf(id,snap){if(id==='owner')return OWNER;if(id==='all')return 'Tous';var m=find(id);return m?m.nom:((snap&&snap!=='Ancien membre')?snap:'Ancien membre')}
function unresolved(m){return m.to!=='owner'&&m.to!=='all'&&!find(m.to)&&(!m.toNom||m.toNom==='Ancien membre')}
function gradeOf(id){if(id==='owner')return 0;var m=cmds.filter(function(x){return x._id===id})[0];return m?(m.g|0):-1}
function firstClaim(e){var c=liens.filter(function(l){return key(l.email)===e}).sort(function(a,b){return a.ts-b.ts});return c[0]||null}
function computeMe(){
  if(isOwner)return {id:'owner',nom:OWNER,g:0};
  var l=liens.filter(function(x){return x._id===myId})[0];if(!l)return null;
  var e=key(l.email),f=firstClaim(e);if(!f||f._id!==myId)return null;
  var m=cmds.filter(function(x){return key(x.email)===e})[0];
  return m?{id:m._id,nom:m.nom,g:m.g|0}:null}
var canSign=function(){return me&&SIGN_OK.indexOf(me.g)>-1};
var canEdit=function(){return me&&EDIT_OK.indexOf(me.g)>-1};

async function init(){
  try{
    if(window.claude&&claude.use){
      var user=await claude.use('user');
      var u=user?await user.me():null;myId=u&&u.id?u.id:null;isOwner=!!(u&&u.isOwner);
      db=await claude.use('db')
    }else{
      FB=true;
      var C=window.FIREBASE_CONFIG;
      if(!window.firebase||!C||C.apiKey==='COLLE_ICI'){dbOk=false}
      else{
        firebase.initializeApp(C);
        var usr=await new Promise(function(res){var off=firebase.auth().onAuthStateChanged(function(x){off();res(x)})});
        if(!usr){needLogin=true}
        else{myId=usr.uid;EMAIL=key(usr.email);isOwner=EMAIL===key(window.OWNER_EMAIL);db=firebase.firestore()}
      }
    }
  }catch(e){errMsg=(e&&e.message)||'';}
  if(needLogin){render();return}
  if(!db){dbOk=false;render();return}
  var sub=function(n,cb,k){db.collection(n).onSnapshot(function(s){cb(s.docs.map(function(d){var x=Object.assign({},d.data()||{});x._id=d.id;return x}));ready[k]=true;render()},function(e){ready[k]=true;safeErr(e)})};
  sub('cmds',function(a){cmds=a},'c');
  sub('membres',function(a){membres=a},'m');
  sub('mots',function(a){mots=a.sort(function(x,y){return (y.ts||0)-(x.ts||0)})},'t');
  sub('signatures',function(a){sigs=a},'s');
  sub('liens',function(a){liens=a},'l');
  render()}

function deny(main,title,txt){var d=el('div','panel deny');d.appendChild(el('h2','',title));d.appendChild(el('div','',txt));main.appendChild(d);return d}
function render(){
  var nav=$('nav'),main=$('main'),who=$('who');main.textContent='';who.textContent='';nav.textContent='';nav.className='tbar hide';
  if(!dbOk){deny(main,'LIAISON COUPÉE',FB?'La configuration Firebase est absente ou invalide. Ouvrez index.html et renseignez FIREBASE_CONFIG.':'Le stockage partagé est indisponible dans cette vue. Ouvrez la page publiée.');return}
  if(!myId){
    var dl=deny(main,FB?'CONNEXION REQUISE':'IDENTITÉ INCONNUE',FB?'Connectez-vous avec votre compte Google (celui de votre invitation).':'Connectez-vous avec le compte invité pour ouvrir ce carnet.');
    if(FB&&needLogin){var lb=el('button','','Connexion Google');lb.style.marginTop='16px';
      lb.onclick=function(){var p=new firebase.auth.GoogleAuthProvider();firebase.auth().signInWithPopup(p).then(function(){location.reload()}).catch(function(e){errMsg=e.message;render()})};
      dl.appendChild(lb);if(errMsg)dl.appendChild(el('div','note','⚠ '+errMsg))}
    return}
  if(!(ready.c&&ready.m&&ready.t&&ready.s&&ready.l)){main.appendChild(el('div','empty','Synchronisation des archives…'));return}
  var mine=liens.filter(function(x){return x._id===myId})[0];
  if(FB&&EMAIL&&!isOwner&&!mine&&!linked){linked=true;db.collection('liens').doc(myId).set({email:EMAIL,ts:Date.now()}).catch(safeErr)}
  me=computeMe();
  if(!me&&!isOwner){
    var d;
    if(!mine&&FB){main.appendChild(el('div','empty','Vérification de votre accès…'));return}
    if(!mine){
      d=deny(main,'DÉCLINEZ VOTRE SIGNAL','Entrez l\'adresse e-mail sous laquelle le commandement vous a accordé un grade.');
      var rr=el('div','row');rr.style.cssText='margin-top:14px;justify-content:center';
      var ie=el('input');ie.type='email';ie.placeholder='adresse@email.com';
      var bb=el('button','','Valider');
      bb.onclick=async function(){var e=key(ie.value);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){errMsg='Adresse e-mail invalide';render();return}
        try{await db.collection('liens').doc(myId).set({email:e,ts:Date.now()});errMsg=''}catch(x){safeErr(x)}};
      rr.appendChild(ie);rr.appendChild(bb);d.appendChild(rr)}
    else{
      var f=firstClaim(key(mine.email)),taken=f&&f._id!==myId;
      d=deny(main,'ACCÈS REFUSÉ',taken?'Cette adresse est déjà liée à un autre compte. Demandez au commandement de la délier.':'Aucun grade n\'est lié à cette adresse. Demandez à un commandant de vous en accorder un.');
      var ch=el('button','','Changer d\'adresse');ch.style.marginTop='16px';
      ch.onclick=function(){db.collection('liens').doc(myId).delete().catch(safeErr)};d.appendChild(ch)}
    if(errMsg)main.appendChild(el('div','note','⚠ '+errMsg));return}
  who.appendChild(el('span','',me.nom));who.appendChild(badge(me.g));
  var tabs=[['C','Carnet'],['H','Historique'],['E','Effectif']];tabs.push(['S','Signatures']);
  nav.className='tbar';
  tabs.forEach(function(t){var b=el('button',tab===t[0]?'on':'',t[1]);b.onclick=function(){tab=t[0];render()};nav.appendChild(b)});
  if(errMsg){var n=el('div','note','⚠ '+errMsg);n.style.color='var(--warn)';main.appendChild(n)}
  main.appendChild({C:viewCarnet,H:viewHisto,E:viewEffectif,S:viewSign}[tab]())}

function memberOptions(sel,withAll,withOwner,withBlank){
  if(withBlank){var o0=el('option','',withBlank);o0.value='';sel.appendChild(o0)}
  if(withAll){var o=el('option','','Tous / Général');o.value='all';sel.appendChild(o)}
  var o1=el('option','',OWNER+' · '+GRADES[0]);o1.value='owner';sel.appendChild(o1);
  cmds.slice().sort(function(a,b){return (a.g|0)-(b.g|0)||String(a.nom).localeCompare(b.nom)}).forEach(function(m){var x=el('option','',m.nom+' · '+GRADES[m.g|0]);x.value=m._id;sel.appendChild(x)});
  membres.slice().sort(function(a,b){return String(a.nom).localeCompare(b.nom)}).forEach(function(m){var x=el('option','',m.nom);x.value=m._id;sel.appendChild(x)})}

function motCard(m,i,signMode){
  var c=el('div','panel mot');c.style.animationDelay=Math.min(i*50,400)+'ms';
  var meta=el('div','meta');
  meta.appendChild(el('span','','De :'));meta.appendChild(el('b','',nameOf(m.from,m.fromNom)));meta.appendChild(badge(gradeOf(m.from)));
  meta.appendChild(el('span','',fmt(m.ts)));c.appendChild(meta);
  var tg=el('div','meta');tg.style.cssText='margin-top:6px;font-size:14px';
  tg.appendChild(el('span','','🎯 Ciblé vers :'));
  var tn=el('b','',nameOf(m.to,m.toNom));tn.style.cssText='color:#fff;text-shadow:0 0 8px var(--c)';tg.appendChild(tn);
  tg.appendChild(badge(gradeOf(m.to)));c.appendChild(tg);
  if(unresolved(m)&&canEdit()){
    var fx=el('div','row');fx.style.marginTop='8px';fx.appendChild(el('span','tag','Destinataire perdu, à corriger :'));
    var fs=el('select');memberOptions(fs,false,true,'Choisir…');fx.appendChild(fs);
    var fb=el('button','','Corriger');fb.onclick=function(){if(!fs.value)return;var id=fs.value,nm=id==='owner'?OWNER:((find(id)||{}).nom||'');db.collection('mots').doc(m._id).update({to:id,toNom:nm}).catch(safeErr)};
    fx.appendChild(fb);c.appendChild(fx)}
  c.appendChild(el('div','txt',m.text));
  var ms=sigs.filter(function(s){return s.motId===m._id}).sort(function(a,b){return a.ts-b.ts});
  var sw=el('div','sigs');sw.appendChild(el('span','meta','Signatures ('+ms.length+') :'));
  ms.forEach(function(s){var g=el('span','sg');g.appendChild(el('b','','✔ '));g.appendChild(document.createTextNode(nameOf(s.signerId,s.nom)+' · '+GRADES[gradeOf(s.signerId)]));sw.appendChild(g)});
  c.appendChild(sw);
  var act=el('div','row');act.style.marginTop='12px';
  var mineSig=ms.filter(function(s){return s.signerId===me.id})[0];
  if(signMode&&canSign()){
    if(!mineSig){var sb=el('button','sign','Signer');sb.onclick=async function(){sb.disabled=true;try{await db.collection('signatures').doc(m._id+'_'+me.id).set({motId:m._id,signerId:me.id,nom:me.nom,ts:Date.now()});errMsg=''}catch(e){safeErr(e)}};act.appendChild(sb)}
    else{var rb=el('button','','Retirer ma signature');rb.onclick=function(){db.collection('signatures').doc(m._id+'_'+me.id).delete().catch(safeErr)};act.appendChild(rb)}}
  if(m.from===me.id||canEdit()){
    var del=el('button','danger',CONF===m._id?'Confirmer ?':'Effacer');
    del.onclick=async function(){
      if(CONF!==m._id){CONF=m._id;clearTimeout(CT);CT=setTimeout(function(){CONF=null;render()},5000);render();return}
      CONF=null;clearTimeout(CT);del.disabled=true;del.textContent='Effacement…';
      try{
        for(var k=0;k<ms.length;k++)await db.collection('signatures').doc(ms[k]._id).delete();
        await db.collection('mots').doc(m._id).delete();
        mots=mots.filter(function(x){return x._id!==m._id});sigs=sigs.filter(function(x){return x.motId!==m._id});errMsg='';render()
      }catch(e){safeErr(e)}};
    act.appendChild(del)}
  c.appendChild(act);return c}

function viewCarnet(){
  var box=el('div');
  if(!canEdit())box.appendChild(el('div','note','Lecture seule : seuls CMD Deviss et CMD A\'den écrivent des mots.'));
  else{
  var p=el('div','panel');p.appendChild(el('div','sub','Nouveau mot à transmettre'));
  var cnt=el('div','tag');cnt.style.margin='10px 0 6px';p.appendChild(cnt);
  var tw=el('div');tw.style.marginBottom='12px';p.appendChild(tw);
  function uniq(){var o=[];TARGETS.forEach(function(v){if(v&&o.indexOf(v)<0)o.push(v)});return o}
  function upd(){var n=uniq().length;cnt.textContent=n?('Destinataire'+(n>1?'s':'')+' : '+n+' → '+n+' mot'+(n>1?'s':'')+(n>1?' individuels':'')):'Destinataire :'}
  function drawT(){tw.textContent='';
    TARGETS.forEach(function(v,i){var r=el('div','row');r.style.marginBottom='6px';
      var sel=el('select');sel.style.flex='1';memberOptions(sel,false,true,'Choisir un destinataire…');sel.value=v;
      sel.onchange=function(){TARGETS[i]=sel.value;upd()};r.appendChild(sel);
      if(TARGETS.length>1){var x=el('button','danger','✕');x.title='Retirer';x.onclick=function(){TARGETS.splice(i,1);drawT();upd()};r.appendChild(x)}
      if(i===TARGETS.length-1){var pl=el('button','','+');pl.title='Ajouter un destinataire';pl.onclick=function(){TARGETS.push('');drawT()};r.appendChild(pl)}
      tw.appendChild(r)})}
  drawT();upd();
  var ta=el('textarea');ta.placeholder='Écrivez votre mot…';ta.maxLength=1500;ta.value=DRAFT;ta.oninput=function(){DRAFT=ta.value};p.appendChild(ta);
  var r=el('div','row');r.style.marginTop='10px';
  var b=el('button','','Transmettre');
  b.onclick=async function(){var t=ta.value.trim(),ids=uniq();if(!ids.length){errMsg='Choisissez au moins un destinataire';render();return}if(!t)return;b.disabled=true;
    try{var now=Date.now();await Promise.all(ids.map(function(id,i){return db.collection('mots').doc(rid()).set({text:t,from:me.id,fromNom:me.nom,to:id,toNom:(id==='owner'?OWNER:((find(id)||{}).nom||'')),ts:now+i})}));errMsg='';ta.value='';DRAFT='';TARGETS=[''];render()}catch(e){safeErr(e)}b.disabled=false};
  r.appendChild(b);r.appendChild(el('span','meta','Signature : CMD Deviss, CMD A\'den ou Gérant signature'));p.appendChild(r);box.appendChild(p)}
  box.appendChild(el('div','sub','Derniers mots'));
  if(!mots.length)box.appendChild(el('div','empty','Aucun mot pour l\'instant.'));
  mots.slice(0,5).forEach(function(m,i){box.appendChild(motCard(m,i,false))});
  if(mots.length>5){var more=el('button','','Voir tout l\'historique');more.onclick=function(){tab='H';render()};box.appendChild(more)}
  return box}

function viewHisto(){
  var box=el('div');
  var bar=el('div','tbar');
  var q=el('input');q.placeholder='Rechercher dans les mots…';q.value=F.q;
  var st=el('select');memberOptions(st,false,true,'Destinataire : tous');st.value=F.t;
  var sa=el('select');memberOptions(sa,false,true,'Auteur : tous');sa.value=F.a;
  bar.appendChild(q);bar.appendChild(st);bar.appendChild(sa);box.appendChild(bar);
  var list=el('div');box.appendChild(list);
  function fill(){list.textContent='';var qq=key(F.q);
    var arr=mots.filter(function(m){return (!F.t||m.to===F.t)&&(!F.a||m.from===F.a)&&(!qq||key(m.text).indexOf(qq)>-1)});
    list.appendChild(el('div','note',arr.length+' mot(s) · '+mots.length+' au total'));
    if(!arr.length)list.appendChild(el('div','empty','Aucun résultat.'));
    arr.forEach(function(m,i){list.appendChild(motCard(m,i,false))})}
  q.oninput=function(){F.q=q.value;fill()};st.onchange=function(){F.t=st.value;fill()};sa.onchange=function(){F.a=sa.value;fill()};
  fill();return box}

function viewEffectif(){
  var box=el('div'),ed=canEdit();
  var cols=el('div');cols.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start';
  // Colonne commandement
  var p=el('div','panel');p.appendChild(el('div','sub','Commandement · '+(cmds.length+1)));
  var o=el('div','grid me');o.style.gridTemplateColumns='1fr auto';o.appendChild(el('b','',OWNER));o.appendChild(badge(0));p.appendChild(o);
  cmds.slice().sort(function(a,b){return (a.g|0)-(b.g|0)||String(a.nom).localeCompare(b.nom)}).forEach(function(m){
    var row=el('div','grid');row.style.gridTemplateColumns='1fr';
    if(!ed){var r1=el('div','row');r1.appendChild(el('b','',m.nom));r1.appendChild(badge(m.g|0));row.appendChild(r1);p.appendChild(row);return}
    var nom=el('input');nom.value=m.nom;
    var g=el('select');GRADES.forEach(function(n,i){var x=el('option','',n);x.value=i;if(i===(m.g|0))x.selected=true;g.appendChild(x)});
    var em=el('input');em.type='email';em.placeholder='e-mail (accès)';em.value=m.email||'';
    var act=el('div','row');
    function save(){var n=nom.value.trim();if(!n){nom.value=m.nom;return}db.collection('cmds').doc(m._id).set({nom:n,g:+g.value,email:key(em.value),ts:m.ts||Date.now()}).catch(safeErr)}
    nom.onchange=save;g.onchange=save;em.onchange=save;
    var f=firstClaim(key(m.email));
    if(f){var ul=el('button','','Délier');ul.onclick=function(){db.collection('liens').doc(f._id).delete().catch(safeErr)};act.appendChild(ul)}
    var rm=el('button','danger','Retirer');ask(rm,function(){db.collection('cmds').doc(m._id).delete().catch(safeErr)});act.appendChild(rm);
    var sep=el('div');sep.style.cssText='border-top:1px solid var(--dim);padding-top:8px';
    sep.appendChild(nom);sep.appendChild(document.createElement('div')).style.height='6px';sep.appendChild(g);sep.appendChild(document.createElement('div')).style.height='6px';sep.appendChild(em);sep.appendChild(document.createElement('div')).style.height='6px';sep.appendChild(act);
    nom.style.width=g.style.width=em.style.width='100%';
    row.appendChild(sep);p.appendChild(row)});
  if(ed){
    var a=el('div');a.style.cssText='border-top:1px solid var(--dim);margin-top:14px;padding-top:12px';
    a.appendChild(el('div','tag','Ajouter un grade (accès par e-mail)'));
    var nom2=el('input');nom2.placeholder='Nom affiché (ex : Deviss)';
    var g2=el('select');GRADES.forEach(function(n,i){var x=el('option','',n);x.value=i;g2.appendChild(x)});
    var em2=el('input');em2.type='email';em2.placeholder='e-mail';
    var add=el('button','','Ajouter');
    [nom2,g2,em2].forEach(function(x){x.style.cssText='width:100%;margin:6px 0'});
    add.onclick=async function(){var n=nom2.value.trim(),e=key(em2.value);if(!n||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){errMsg='Nom et e-mail valides requis';render();return}
      try{await db.collection('cmds').doc(rid()).set({nom:n,g:+g2.value,email:e,ts:Date.now()});errMsg=''}catch(x){safeErr(x)}};
    a.appendChild(nom2);a.appendChild(g2);a.appendChild(em2);a.appendChild(add);p.appendChild(a)}
  cols.appendChild(p);
  // Colonne membres (noms seulement)
  var q=el('div','panel');q.appendChild(el('div','sub','Membres · '+membres.length));
  membres.slice().sort(function(a,b){return String(a.nom).localeCompare(b.nom)}).forEach(function(m){
    var row=el('div','row');row.style.cssText='justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(27,77,110,.5)';
    if(!ed){row.appendChild(el('span','',m.nom));q.appendChild(row);return}
    var ni=el('input');ni.value=m.nom;ni.style.flex='1';
    ni.onchange=function(){var n=ni.value.trim();if(!n){ni.value=m.nom;return}db.collection('membres').doc(m._id).set({nom:n,ts:m.ts||Date.now()}).catch(safeErr)};
    var rm=el('button','danger','✕');rm.title='Retirer';ask(rm,function(){db.collection('membres').doc(m._id).delete().catch(safeErr)});
    row.appendChild(ni);row.appendChild(rm);q.appendChild(row)});
  if(!membres.length)q.appendChild(el('div','empty','Aucun membre.'));
  if(ed){
    var r2=el('div','row');r2.style.marginTop='12px';
    var nn=el('input');nn.placeholder='Nouveau membre';nn.style.flex='1';
    var ab=el('button','','Ajouter');
    ab.onclick=async function(){var n=nn.value.trim();if(!n)return;try{await db.collection('membres').doc(rid()).set({nom:n,ts:Date.now()});errMsg='';nn.value=''}catch(e){safeErr(e)}};
    r2.appendChild(nn);r2.appendChild(ab);q.appendChild(r2)}
  cols.appendChild(q);box.appendChild(cols);
  box.appendChild(el('div','note',ed?'Les membres sont de simples noms, sans e-mail ni accès : ils servent de destinataires. Seuls les grades du commandement se connectent (invitez-les par e-mail dans le partage ; à leur première visite ils déclarent leur e-mail, le premier compte à le faire est lié).':'Seuls CMD Deviss et CMD A\'den modifient l\'effectif (le Gérant signature et les Officiers le consultent).'));
  return box}

function viewSign(){
  var box=el('div');var bar=el('div','tbar');bar.style.justifyContent='center';
  if(!canSign()){SF='all';box.appendChild(el('div','note','Lecture seule : votre grade (Officier) ne permet pas de signer.'))}
  else [['todo','À signer'],['mine','Mes signatures'],['all','Tous']].forEach(function(t){var b=el('button',SF===t[0]?'on':'',t[1]);b.onclick=function(){SF=t[0];render()};bar.appendChild(b)});
  if(canSign())box.appendChild(bar);
  var arr=mots.filter(function(m){var s=sigs.some(function(x){return x.motId===m._id&&x.signerId===me.id});return SF==='all'||(SF==='todo'?!s:s)});
  if(!arr.length)box.appendChild(el('div','empty',SF==='todo'?'Rien à signer. Tout est à jour.':'Aucun mot.'));
  arr.forEach(function(m,i){box.appendChild(motCard(m,i,true))});
  return box}

render();init();
})();
</script>
</body>
